name: Gossip Bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log what it would post, don't actually post)"
        type: boolean
        default: true
  # No schedule: trigger here on purpose -- GitHub's native cron proved unreliable for the
  # ticker bot at a 15min cadence too. An external cron-job.org job calls the
  # workflow_dispatch REST API endpoint on a schedule instead (see DESIGN.md).

concurrency:
  group: gossip-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Remove broken preinstalled apt repos
        run: |
          # Known GH-hosted-runner issue: the preregistered Microsoft Azure CLI apt repo
          # intermittently serves a corrupted signature, which makes apt-get update fail
          # entirely and takes the unrelated Playwright browser install down with it.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Write env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > my.env
          echo "TITANS_WATCHLIST=${{ vars.TITANS_WATCHLIST }}" >> my.env
          echo "NEWS_FRESHNESS_HOURS=48" >> my.env
          echo "GOSSIP_SEEN_MEMORY_DAYS=14" >> my.env
          # Every trigger is workflow_dispatch now (no schedule: trigger) -- but that means
          # the external cron-job.org call MUST explicitly pass inputs.dry_run=false in its
          # POST body, or this silently falls back to the checkbox's default (true) and never
          # actually posts. See DESIGN.md for the exact cron-job.org request configuration.
          echo "DRY_RUN=${{ inputs.dry_run }}" >> my.env
          echo "MAX_POSTS_PER_CYCLE=3" >> my.env
          # Several minutes between successive posts in the same cycle, not seconds -- this
          # was NOT being set here before, so the deployed bot was silently relying on
          # gossip_bot.py's own fallback default rather than an explicit, reviewed value.
          echo "POST_PACING_SECONDS=240" >> my.env

      - name: Decode Twitter session
        run: echo "${{ secrets.TWITTER_SESSION }}" | base64 -d > twitter_session.json

      - name: Run bot cycle
        run: python gossip_bot.py

      - name: Save state back to repo
        if: always()
        run: |
          # NEVER use `git push --force` here. It previously destroyed a real code commit
          # ("Add real article context...") that landed on origin between this job's checkout
          # and this step running -- the force push overwrote origin's tip with a branch based
          # on this job's now-stale checkout, silently discarding that commit.
          #
          # A follow-up fix using `git reset --soft origin/main` was ALSO wrong, just in a
          # subtler way: --soft only moves HEAD -- it does NOT update the index or working
          # tree. So the index still held whatever gossip_bot.py/DESIGN.md looked like at
          # THIS job's original (possibly stale) checkout, and the resulting commit silently
          # reverted real code back to that stale version while still saving the new
          # state.json. Confirmed live: two later feature commits got reverted and restored
          # repeatedly (state: 10:22 reverted 115 lines, state: 10:26 restored them, state:
          # 10:27 reverted them again) as different runs with different-aged checkouts each
          # took their turn silently stomping the code.
          #
          # Actual fix: `git reset --hard origin/main` to make BOTH the index AND the working
          # tree exactly match the current true origin content (eliminating any stale-file
          # risk entirely), then restore ONLY the bot's freshly-written state.json on top
          # (saved to a path outside the repo first, since --hard would otherwise overwrite
          # it back to origin's old version too) before committing.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          cp state.json /tmp/new_state.json
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/new_state.json state.json
            git add state.json
            if git diff --staged --quiet; then
              echo "No state changes to commit."
              exit 0
            fi
            git commit -m "state: $(date -u +%H:%M)"
            if git push origin main; then
              exit 0
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "::error::Failed to push state.json after 3 attempts — dedup state is stale on remote, risking duplicate posts until a future run succeeds."
          exit 1
